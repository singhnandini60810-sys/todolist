<!DOCTYPE html>
<html>
<head>
<title>Advanced To-Do App</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:20px;
border-radius:12px;
width:380px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
text-align:center;
}

input,select{
padding:6px;
margin:5px 0;
}

#taskInput{
width:65%;
}

#dateInput{
width:30%;
}

button{
padding:6px 8px;
cursor:pointer;
border:none;
border-radius:5px;
}

.addBtn{
background:#4CAF50;
color:white;
}

ul{
list-style:none;
padding:0;
margin-top:10px;
}

li{
background:#f1f1f1;
margin:6px 0;
padding:8px;
display:flex;
justify-content:space-between;
align-items:center;
border-radius:6px;
font-size:14px;
}

.completed{
text-decoration:line-through;
color:gray;
}

.low{border-left:6px solid green;}
.medium{border-left:6px solid orange;}
.high{border-left:6px solid red;}

.taskInfo{
flex-grow:1;
cursor:pointer;
}

.controls button{
margin-left:5px;
}

.progress{
margin-top:10px;
font-size:14px;
}

.dark{
background:#1e1e1e;
color:white;
}

.dark .container{
background:#2a2a2a;
}

.dark li{
background:#3a3a3a;
}

.topBtns{
display:flex;
justify-content:space-between;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h2>📝 Advanced To-Do</h2>

<input type="text" id="taskInput" placeholder="Task">
<input type="date" id="dateInput">

<select id="priorityInput">
<option value="low">Low</option>
<option value="medium">Medium</option>
<option value="high">High</option>
</select>

<button class="addBtn" onclick="addTask()">Add</button>

<div class="progress" id="progress"></div>

<ul id="taskList"></ul>

<div class="topBtns">
<button onclick="clearCompleted()">Clear Completed</button>
<button onclick="toggleDark()">🌙 Dark Mode</button>
</div>

</div>

<script>

let tasks=[];

function addTask(){

let text=document.getElementById("taskInput").value.trim();
let date=document.getElementById("dateInput").value;
let priority=document.getElementById("priorityInput").value;

if(text==="") return;

tasks.push({
text:text,
date:date,
priority:priority,
completed:false
});

document.getElementById("taskInput").value="";
render();
save();
}

function render(){

let list=document.getElementById("taskList");
list.innerHTML="";

tasks.forEach((task,index)=>{

let li=document.createElement("li");
li.classList.add(task.priority);

if(task.completed) li.classList.add("completed");

let info=document.createElement("div");
info.className="taskInfo";
info.innerHTML=
task.text+
(task.date ? " 📅 "+task.date : "");

info.onclick=()=>{
task.completed=!task.completed;
save();
render();
};

let controls=document.createElement("div");
controls.className="controls";

let edit=document.createElement("button");
edit.textContent="✏️";

edit.onclick=()=>{
let newText=prompt("Edit task",task.text);
if(newText){
task.text=newText;
save();
render();
}
};

let del=document.createElement("button");
del.textContent="❌";

del.onclick=()=>{
tasks.splice(index,1);
save();
render();
};

controls.appendChild(edit);
controls.appendChild(del);

li.appendChild(info);
li.appendChild(controls);

list.appendChild(li);

});

updateProgress();
}

function updateProgress(){

let total=tasks.length;
let completed=tasks.filter(t=>t.completed).length;

document.getElementById("progress").textContent=
"Completed: "+completed+" / "+total;

}

function clearCompleted(){

tasks=tasks.filter(t=>!t.completed);
save();
render();

}

function save(){
localStorage.setItem("tasks",JSON.stringify(tasks));
}

function load(){

let data=localStorage.getItem("tasks");

if(data){
tasks=JSON.parse(data);
}

render();

}

function toggleDark(){
document.body.classList.toggle("dark");
}

document.getElementById("taskInput").addEventListener("keypress",function(e){

if(e.key==="Enter") addTask();

});

window.onload=load;

</script>

</body>
</html>
